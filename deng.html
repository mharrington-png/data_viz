<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mario Kart eBay Auctions</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: #f7f8fc;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 36px 20px;
    min-height: 100vh;
    color: #1e1e2e;
  }

  .card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    padding: 36px 40px 28px;
    max-width: 820px;
    width: 100%;
  }

  .header { margin-bottom: 6px; }
  .header h1 {
    font-size: 1.35rem;
    font-weight: 700;
    color: #1e1e2e;
    letter-spacing: -0.3px;
  }
  .header p {
    font-size: 0.82rem;
    color: #6b7280;
    margin-top: 4px;
  }
  .question-box {
    background: #f0f4ff;
    border-left: 4px solid #4f6ef7;
    border-radius: 6px;
    padding: 10px 14px;
    margin: 14px 0 22px;
    font-size: 0.85rem;
    color: #3b4a6b;
    font-weight: 500;
  }

  #chart-container {
    position: relative;
    width: 100%;
  }

  canvas { display: block; width: 100% !important; }

  .tooltip {
    position: absolute;
    background: #1e1e2e;
    color: #fff;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 0.78rem;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    white-space: nowrap;
    z-index: 10;
    line-height: 1.6;
  }

  .legend {
    display: flex;
    gap: 20px;
    margin-top: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 0.78rem;
    color: #4b5563;
  }
  .legend-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .stats-row {
    display: flex;
    gap: 12px;
    margin-top: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .stat-box {
    background: #f7f8fc;
    border-radius: 10px;
    padding: 10px 18px;
    text-align: center;
    flex: 1;
    min-width: 120px;
  }
  .stat-box .val {
    font-size: 1.1rem;
    font-weight: 700;
    color: #4f6ef7;
  }
  .stat-box .lbl {
    font-size: 0.72rem;
    color: #6b7280;
    margin-top: 2px;
  }

  .footnote {
    font-size: 0.72rem;
    color: #9ca3af;
    text-align: center;
    margin-top: 14px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>🎮 Mario Kart eBay Auctions</h1>
    <p>Sample of 143 individual auctions · Source: <em>mariokart.csv</em></p>
  </div>
  <div class="question-box">
    Research Question: Does a higher starting price lead to a higher total final price paid?
  </div>
  <div id="chart-container">
    <canvas id="scatter" height="420"></canvas>
    <div class="tooltip" id="tip"></div>
  </div>
  <div class="legend" id="legend"></div>
  <div class="stats-row" id="stats"></div>
  <div class="footnote">Hover over any point to see auction details &nbsp;·&nbsp; n = 143 auctions</div>
</div>

<script>
const raw = [
  [0.99,1,55.5],[0.99,1,52.99],[1,1,42.97],[1,2,46.03],[1,5,43.98],[1,3,37.96],[1,2,40.95],[1,3,44.95],[1,1,39],[1,3,46.5],[1.25,3,47.41],[1.25,2,45.5],[1.49,2,45.49],[1.5,2,45],[1.75,1,43],[1.95,2,48],[1.99,1,41.97],[1.99,1,45.49],[1.99,2,47.99],[1.99,1,48.97],[1.99,2,48.97],[1.99,3,52.99],[1.99,2,44.95],[1.99,2,46.95],[1.99,1,44.94],[1.99,1,44.97],[1.99,3,50.94],[2,1,43.98],[2,2,43.97],[2,1,43.97],[2,2,46.49],[2,4,48.5],[2.25,2,46.22],[2.49,3,49.97],[2.5,1,42.97],[2.5,3,48.5],[2.5,2,47.95],[2.75,1,41.95],[2.99,1,47.5],[2.99,2,47.5],[2.99,2,50.97],[2.99,2,47.97],[3,1,47.97],[3.5,2,44.97],[3.5,2,47.97],[3.99,2,46],[3.99,2,48.97],[3.99,3,51.97],[3.99,2,51.95],[3.99,3,54],[4,5,49.95],[4.99,2,50.97],[4.99,1,44.97],[4.99,2,51],[4.99,2,49.97],[4.99,5,52.98],[5,3,48.97],[5,3,53.97],[5,2,51.97],[5.25,1,49.97],[5.5,3,49.5],[5.99,2,49.97],[5.99,2,52.97],[5.99,4,54],[6,3,51.95],[6.25,2,52],[6.99,4,54.97],[6.99,2,57.97],[7,2,54],[7,3,57.95],[7.49,3,55.47],[7.5,1,52],[7.95,3,55.96],[7.99,5,57.95],[7.99,4,55.97],[7.99,2,55.97],[8,2,56],[8,4,57.97],[8.5,3,51.97],[8.5,3,54.95],[8.99,3,57.97],[8.99,2,56],[9,3,56.97],[9.49,2,55],[9.99,4,59.97],[9.99,1,54.97],[9.99,2,56.97],[9.99,2,59.97],[9.99,2,56.97],[10,3,58.97],[10,5,62.95],[10,2,60.96],[10.45,2,57.95],[10.99,3,64.97],[10.99,2,58.97],[10.99,3,61.97],[11,3,59.97],[11,4,62.95],[11,2,57.97],[11.99,2,59.97],[11.99,4,62.97],[12,3,63.95],[12,2,57],[12,5,62],[12.5,2,61.97],[12.99,3,65],[12.99,3,64.97],[12.99,4,65.97],[13,4,67.97],[13.5,4,68],[13.99,2,65.97],[14,3,63.97],[14,3,65.97],[14.99,3,67.97],[14.99,5,67.97],[15,3,64.97],[15,2,66.97],[15,3,69.97],[15.5,3,67.95],[15.99,4,68.97],[16,2,68.97],[16.99,4,72.97],[17,3,68.97],[17.99,5,73],[18,3,72.97],[18.99,5,77.97],[19.99,2,74.97],[20,4,76.97],[20,4,79.97],[20,4,77.97],[20.5,3,77],[21,3,78.97],[22,4,80.97],[23,4,86.97],[24.99,3,82.97],[25,4,88.97],[26,5,91.95],[27,3,87.97],[27.99,5,89.97],[29,4,91.97],[29.99,5,94.97],[30,4,90.97],[30,5,95],[35,5,101.97],[39.99,4,109.96],[59,6,124.97]
];

const canvas = document.getElementById('scatter');
const tip = document.getElementById('tip');
const dpr = window.devicePixelRatio || 1;

const PAD = { top: 30, right: 30, bottom: 60, left: 68 };

function getColor(startPr) {
  if (startPr < 5) return '#4f6ef7';
  if (startPr < 15) return '#f59e0b';
  return '#ef4444';
}

function getLabel(startPr) {
  if (startPr < 5) return 'Low Start (< $5)';
  if (startPr < 15) return 'Mid Start ($5–$15)';
  return 'High Start (≥ $15)';
}

let W, H, scaleX, scaleY, points = [];

function setup() {
  const rect = canvas.parentElement.getBoundingClientRect();
  W = rect.width;
  H = 420;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  canvas.width = W * dpr;
  canvas.height = H * dpr;

  const xVals = raw.map(d => d[0]);
  const yVals = raw.map(d => d[2]);
  const xMin = 0, xMax = Math.ceil(Math.max(...xVals) / 5) * 5 + 5;
  const yMin = Math.floor(Math.min(...yVals) / 10) * 10 - 5;
  const yMax = Math.ceil(Math.max(...yVals) / 10) * 10 + 5;

  const plotW = W - PAD.left - PAD.right;
  const plotH = H - PAD.top - PAD.bottom;

  scaleX = v => PAD.left + (v - xMin) / (xMax - xMin) * plotW;
  scaleY = v => H - PAD.bottom - (v - yMin) / (yMax - yMin) * plotH;

  points = raw.map(d => ({
    sx: d[0], wheels: d[1], tp: d[2],
    x: scaleX(d[0]), y: scaleY(d[2]),
    color: getColor(d[0])
  }));

  // regression
  const n = raw.length;
  const mx = raw.reduce((s,d)=>s+d[0],0)/n;
  const my = raw.reduce((s,d)=>s+d[2],0)/n;
  const num = raw.reduce((s,d)=>s+(d[0]-mx)*(d[2]-my),0);
  const den = raw.reduce((s,d)=>s+(d[0]-mx)**2,0);
  const slope = num/den;
  const inter = my - slope*mx;

  // correlation
  const sdx = Math.sqrt(raw.reduce((s,d)=>s+(d[0]-mx)**2,0)/n);
  const sdy = Math.sqrt(raw.reduce((s,d)=>s+(d[2]-my)**2,0)/n);
  const r = (num/n)/(sdx*sdy);

  draw(slope, inter, xMin, xMax, yMin, yMax, plotW, plotH, r);
  buildStats(mx, my, r, slope);
}

function draw(slope, inter, xMin, xMax, yMin, yMax, plotW, plotH, r) {
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);

  // grid
  ctx.strokeStyle = '#e5e7eb';
  ctx.lineWidth = 1;
  for (let v = Math.ceil(yMin/10)*10; v <= yMax; v += 10) {
    const y = scaleY(v);
    ctx.beginPath(); ctx.moveTo(PAD.left, y); ctx.lineTo(W - PAD.right, y); ctx.stroke();
  }
  for (let v = 0; v <= xMax; v += 10) {
    const x = scaleX(v);
    ctx.beginPath(); ctx.moveTo(x, PAD.top); ctx.lineTo(x, H - PAD.bottom); ctx.stroke();
  }

  // axes
  ctx.strokeStyle = '#d1d5db';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(PAD.left, PAD.top); ctx.lineTo(PAD.left, H - PAD.bottom);
  ctx.lineTo(W - PAD.right, H - PAD.bottom);
  ctx.stroke();

  // axis labels
  ctx.fillStyle = '#6b7280';
  ctx.font = `500 11px Inter, sans-serif`;
  ctx.textAlign = 'center';
  for (let v = 0; v <= xMax; v += 10) {
    ctx.fillText('$' + v, scaleX(v), H - PAD.bottom + 18);
  }
  ctx.textAlign = 'right';
  for (let v = Math.ceil(yMin/10)*10; v <= yMax; v += 10) {
    ctx.fillText('$' + v, PAD.left - 8, scaleY(v) + 4);
  }

  // axis titles
  ctx.fillStyle = '#374151';
  ctx.font = `600 12px Inter, sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText('Starting Price (USD)', PAD.left + plotW / 2, H - 10);
  ctx.save();
  ctx.translate(16, PAD.top + plotH / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.fillText('Total Final Price (USD)', 0, 0);
  ctx.restore();

  // regression line
  const x1 = scaleX(xMin), y1 = scaleY(slope * xMin + inter);
  const x2 = scaleX(xMax), y2 = scaleY(slope * xMax + inter);
  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth = 1.8;
  ctx.setLineDash([5, 4]);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.setLineDash([]);

  // r label
  ctx.fillStyle = '#64748b';
  ctx.font = `500 11px Inter, sans-serif`;
  ctx.textAlign = 'left';
  ctx.fillText(`r = ${r.toFixed(3)}`, scaleX(xMax) - 70, scaleY(slope * xMax + inter) - 10);

  // points
  points.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 5.5, 0, Math.PI * 2);
    ctx.fillStyle = p.color + 'cc';
    ctx.fill();
    ctx.strokeStyle = p.color;
    ctx.lineWidth = 1;
    ctx.stroke();
  });
}

function buildStats(mx, my, r, slope) {
  const statsEl = document.getElementById('stats');
  const items = [
    { val: '$' + mx.toFixed(2), lbl: 'Mean Start Price' },
    { val: '$' + my.toFixed(2), lbl: 'Mean Final Price' },
    { val: r.toFixed(3), lbl: 'Correlation (r)' },
    { val: '+$' + slope.toFixed(2), lbl: 'Slope (per $1 start)' },
  ];
  statsEl.innerHTML = items.map(i =>
    `<div class="stat-box"><div class="val">${i.val}</div><div class="lbl">${i.lbl}</div></div>`
  ).join('');

  const legendEl = document.getElementById('legend');
  const cats = [
    { label: 'Low Start (< $5)', color: '#4f6ef7' },
    { label: 'Mid Start ($5–$15)', color: '#f59e0b' },
    { label: 'High Start (≥ $15)', color: '#ef4444' },
    { label: '── Regression Line', color: '#94a3b8' },
  ];
  legendEl.innerHTML = cats.map(c =>
    `<div class="legend-item"><div class="legend-dot" style="background:${c.color}"></div><span>${c.label}</span></div>`
  ).join('');
}

// tooltip
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  let found = null, minD = 12;
  points.forEach(p => {
    const d = Math.hypot(p.x - mx, p.y - my);
    if (d < minD) { minD = d; found = p; }
  });
  if (found) {
    tip.style.opacity = 1;
    tip.style.left = (found.x + 12) + 'px';
    tip.style.top = (found.y - 36) + 'px';
    tip.innerHTML = `<strong>Start:</strong> $${found.sx.toFixed(2)}<br><strong>Final:</strong> $${found.tp.toFixed(2)}<br><strong>Wheels:</strong> ${found.wheels}`;
  } else {
    tip.style.opacity = 0;
  }
});
canvas.addEventListener('mouseleave', () => tip.style.opacity = 0);

setup();
window.addEventListener('resize', setup);
</script>
</body>
</html>
