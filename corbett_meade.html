<script>
  const rawData = [
    { substance: "Acetazolamide", concentration: 1885 },
    { substance: "Acetazolamide", concentration: 6328 },
    { substance: "Acetazolamide", concentration: 48 },
    { substance: "Acetazolamide", concentration: 316400 },
    { substance: "Acetazolamide", concentration: 14 },
    { substance: "Zolpidem", concentration: 0.7 },
    { substance: "Zolpidem", concentration: 21.5 },
    { substance: "Zolpidem", concentration: 127.2 },
    { substance: "THC", concentration: 14 },
    { substance: "THC", concentration: 152 },
    { substance: "THC", concentration: 48 },
    { substance: "Caffeine", concentration: 8200 },
    { substance: "Caffeine", concentration: 8300 },
    { substance: "Codeine", concentration: 1297 },
    { substance: "Morphine", concentration: 274 }
  ];

  function summarize(stat) {
    return Array.from(
      d3.group(rawData, d => d.substance),
      ([substance, values]) => ({
        substance: substance,
        value: stat === "mean"
          ? d3.mean(values, d => d.concentration)
          : d3.median(values, d => d.concentration)
      })
    );
  }

  const svg = d3.select("svg");
  const margin = { top: 20, right: 30, bottom: 80, left: 90 };
  const width = +svg.attr("width") - margin.left - margin.right;
  const height = +svg.attr("height") - margin.top - margin.bottom;

  const g = svg.append("g")
    .attr("transform", `translate(${margin.left},${margin.top})`);

  const xScale = d3.scaleBand().range([0, width]).padding(0.2);
  const yScale = d3.scaleLog().range([height, 0]);

  const xAxis = g.append("g")
    .attr("transform", `translate(0,${height})`);

  const yAxis = g.append("g");

  const yLabel = g.append("text")
    .attr("class", "axis-label")
    .attr("transform", "rotate(-90)")
    .attr("x", -height / 2)
    .attr("y", -65)
    .attr("text-anchor", "middle");

  const tooltip = d3.select(".tooltip");

  function update(stat) {
    const data = summarize(stat);

    xScale.domain(data.map(d => d.substance));
    yScale.domain([1, d3.max(data, d => d.value)]);

    xAxis.call(d3.axisBottom(xScale))
      .selectAll("text")
      .attr("transform", "rotate(-30)")
      .style("text-anchor", "end");

    yAxis.call(d3.axisLeft(yScale).ticks(6, "~s"));

    yLabel.text(`${stat.charAt(0).toUpperCase() + stat.slice(1)} Concentration (log scale)`);

    const bars = g.selectAll("rect")
      .data(data, d => d.substance);

    bars.enter()
      .append("rect")
      .attr("class", "bar")
      .attr("x", d => xScale(d.substance))
      .attr("width", xScale.bandwidth())
      .attr("y", height)
      .attr("height", 0)
      .merge(bars)
      .transition()
      .duration(600)
      .attr("x", d => xScale(d.substance))
      .attr("width", xScale.bandwidth())
      .attr("y", d => yScale(d.value))
      .attr("height", d => height - yScale(d.value));

    bars.exit().remove();

    g.selectAll("rect")
      .on("mousemove", (event, d) => {
        tooltip
          .style("opacity", 1)
          .html(`<strong>${d.substance}</strong><br>${stat}: ${d.value.toFixed(1)}`)
          .style("left", (event.pageX + 10) + "px")
          .style("top", (event.pageY - 28) + "px");
      })
      .on("mouseout", () => tooltip.style("opacity", 0));
  }

  update("mean");

  d3.select("#meanBtn").on("click", () => {
    update("mean");
    d3.select("#meanBtn").classed("active", true);
    d3.select("#medianBtn").classed("active", false);
  });

  d3.select("#medianBtn").on("click", () => {
    update("median");
    d3.select("#meanBtn").classed("active", false);
    d3.select("#medianBtn").classed("active", true);
  });
</script>
